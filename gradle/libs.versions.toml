[versions]
java = "21"
kotlin = "2.2.21"
spring-boot = "4.0.3"
spring-dependency-management = "1.1.7"
spring-cloud = "2025.1.0"
springdoc = "3.0.2"
keycloak = "26.0.5"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

[libraries]
# ---------------------------------------------------------------------------
# Kotlin – versions provided by Spring Boot BOM; omit version.ref intentionally
# ---------------------------------------------------------------------------
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }

# ---------------------------------------------------------------------------
# Jackson – version provided by Spring Boot BOM
# ---------------------------------------------------------------------------
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

# ---------------------------------------------------------------------------
# JUnit Platform – version provided by Spring Boot BOM
# ---------------------------------------------------------------------------
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# ---------------------------------------------------------------------------
# Spring Boot Starters – versions provided by Spring Boot BOM
# ---------------------------------------------------------------------------
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }
spring-boot-starter-opentelemetry-test = { module = "org.springframework.boot:spring-boot-starter-opentelemetry-test" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

# ---------------------------------------------------------------------------
# Spring Security – version provided by Spring Boot BOM
# ---------------------------------------------------------------------------
spring-security-test = { module = "org.springframework.security:spring-security-test" }

# ---------------------------------------------------------------------------
# Spring Cloud – versions provided by Spring Cloud BOM
# (imported per-module via dependencyManagement { imports { mavenBom(...) } })
# ---------------------------------------------------------------------------
spring-cloud-gateway-server-webmvc = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc" }
spring-cloud-eureka-server = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-server" }
spring-cloud-eureka-client = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client" }
spring-cloud-circuitbreaker-resilience4j = { module = "org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j" }

# ---------------------------------------------------------------------------
# SpringDoc OpenAPI – NOT managed by any BOM; explicit version required
# ---------------------------------------------------------------------------
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
springdoc-openapi-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }

# ---------------------------------------------------------------------------
# Keycloak – NOT managed by any BOM; IAM-specific; explicit version required
# ---------------------------------------------------------------------------
keycloak-admin-client = { module = "org.keycloak:keycloak-admin-client", version.ref = "keycloak" }

[bundles]
# kotlin-testing: the two test artifacts consistently used together across
# all application modules.  Apply kotlin-test-junit5 as testImplementation
# and junit-platform-launcher as testRuntimeOnly (they must be split because
# the launcher is runtime-only).  No single bundle can express that split,
# so bundles are deliberately omitted here to avoid misuse.
#
# Rationale: a bundle is only valuable when all its members always share
# the same dependency configuration.  The mixed testImplementation /
# testRuntimeOnly split disqualifies the obvious "kotlin-testing" bundle.
