spring:
  application:
    name: discovery

server:
  port: ${DISCOVERY_PORT:8761}

eureka:
  instance:
    hostname: ${DISCOVERY_HOSTNAME:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
