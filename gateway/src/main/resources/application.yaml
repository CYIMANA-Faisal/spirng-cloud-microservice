spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: iam
              uri: lb://iam
              predicates:
                - Path=/api/iam/**
            - id: iam-openapi
              uri: lb://iam
              predicates:
                - Path=/v3/api-docs/iam
              filters:
                - RewritePath=/v3/api-docs/iam, /v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: IAM
        url: /v3/api-docs/iam
    doc-expansion: none
    operations-sorter: method
    persist-authorization: true
    syntax-highlight:
      theme: arta
    tags-sorter: alpha

server:
  port: ${GATEWAY_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
