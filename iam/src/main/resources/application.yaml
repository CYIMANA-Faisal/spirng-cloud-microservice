spring:
  application:
    name: iam
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IAM_KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/master}

server:
  port: ${IAM_PORT:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

keycloak:
  realm: ${IAM_KEYCLOAK_REALM:master}
  server-url: ${IAM_KEYCLOAK_SERVER_URL:http://localhost:8080}
  token-endpoint: ${IAM_KEYCLOAK_TOKEN_ENDPOINT:http://localhost:8080/realms/master/protocol/openid-connect/token}
  logout-endpoint: ${IAM_KEYCLOAK_LOGOUT_ENDPOINT:http://localhost:8080/realms/master/protocol/openid-connect/logout}
  client-id: ${IAM_KEYCLOAK_CLIENT_ID:iam-public}
  admin:
    server-url: ${IAM_KEYCLOAK_SERVER_URL:http://localhost:8080}
    realm: ${IAM_KEYCLOAK_REALM:master}
    client-id: ${IAM_KEYCLOAK_ADMIN_CLIENT_ID:iam-admin}
    client-secret: ${IAM_KEYCLOAK_ADMIN_CLIENT_SECRET:changeme}

springdoc:
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.company.iam

resilience4j:
  circuitbreaker:
    instances:
      keycloak-admin:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
